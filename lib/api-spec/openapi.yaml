        - code
        - cartTotal

    CouponValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        coupon:
          $ref: "#/components/schemas/Coupon"
        discountAmount:
          type: number
        message:
          type: ["string", "null"]
      required:
        - valid
        - discountAmount

    # ── Inventory ──
    Warehouse:
      type: object
      properties:
        id:
          type: integer
        nameHe:
          type: string
        location:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nameHe
        - isActive
        - createdAt

    CreateWarehouseBody:
      type: object
      properties:
        nameHe:
          type: string
        location:
          type: ["string", "null"]
        isActive:
          type: boolean
      required:
        - nameHe

    StockItem:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        product:
          $ref: "#/components/schemas/Product"
        warehouseId:
          type: integer
        warehouse:
          $ref: "#/components/schemas/Warehouse"
        quantity:
          type: integer
        reservedQuantity:
          type: integer
        availableQuantity:
          type: integer
        lowStockThreshold:
          type: integer
        isLowStock:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - productId
        - product
        - warehouseId
        - warehouse
        - quantity
        - reservedQuantity
        - availableQuantity
        - lowStockThreshold
        - isLowStock
        - updatedAt

    AdjustStockBody:
      type: object
      properties:
        productId:
          type: integer
        warehouseId:
          type: integer
        quantity:
          type: integer
        reason:
          type: string
      required:
        - productId
        - warehouseId
        - quantity
        - reason

    StockHistoryItem:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        warehouseId:
          type: ["integer", "null"]
        quantityBefore:
          type: integer
        quantityAfter:
          type: integer
        change:
          type: integer
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
